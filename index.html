<style>
:root{--bg:#0a0a0a;--bg2:#141414;--tx:#f2efe9;--mu:#9a9a9a;--go:#c9a961;--bd:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:72px;height:auto}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;line-height:1.1}

.sub{color:var(--mu);max-width:560px;margin-bottom:36px}.tag{color:var(--go);letter-spacing:3px;font-size:12px;text-transform:uppercase}
.btn{display:inline-block;background:var(--go);color:#111;font-weight:600;padding:14px 26px;border:1px solid var(--go);border-radius:3px;cursor:pointer;font:600 13px Inter;letter-spacing:1.5px;text-transform:uppercase;transition:.25s}
.btn:hover{background:transparent;color:var(--go)}.btn.o{background:transparent;color:var(--tx);border-color:#666}.btn.o:hover{border-color:var(--go);color:var(--go)}
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}

let B={};const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,br=s=>s.split('-').reverse().join('/');
function slotsFor(date){const [y,m,d]=date.split('-').map(Number),h=C.hours[new Date(y,m-1,d).getDay()];if(!h||!h[0]||!h[1])return[];let [a,b]=h.map(x=>x.split(':').reduce((p,q)=>p*60+ +q));const out=[];for(let t=a;t+30<=b;t+=30)out.push(`${pad(t/60|0)}:${pad(t%60)}`);
 const ids=B.barber==='any'?C.barbers.map(x=>x.id):[B.barber],bad=(id,t)=>C.bookings.some(k=>k.barber===id&&k.date===date&&k.time===t)||C.blocks.some(k=>(k.barber==='all'||k.barber===id)&&k.date===date&&(!k.time||k.time===t));
 const now=new Date(),isToday=date===iso(now);return out.filter(t=>ids.some(id=>!bad(id,t))&&!(isToday&&t<=`${pad(now.getHours())}:${pad(now.getMinutes())}`))}
const dayOpen=d=>!!(C.hours[d.getDay()]&&C.hours[d.getDay()][0]&&C.hours[d.getDay()][1])&&d>=new Date(new Date().setHours(0,0,0,0));
function firstAvail(){const t=new Date();for(let i=0;i<90;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);if(dayOpen(d)&&slotsFor(iso(d)).length)return d}return null}
function gotoStep3(){const f=firstAvail();if(f)B.month=new Date(f.getFullYear(),f.getMonth(),1)}
function openBk(p={}){B={step:p.service?(p.barber?3:2):(p.barber?1:1),service:p.service||'',barber:p.barber||'',date:'',time:'',name:'',phone:'',email:'',month:new Date(),err:''};if(p.service&&p.barber)B.step=3;else if(p.service)B.step=2;else B.step=1;if(B.step===3)gotoStep3();bk.classList.add('on');drawBk()}
const closeBk=()=>bk.classList.remove('on'),setB=(k,v,n)=>{B[k]=v;B.err='';if(n){B.step=n;if(n===3&&!B.date)gotoStep3()}drawBk()};
function next(){const s=B.step;if(s===5){const ph_=B.phone.replace(/\D/g,'');if(B.name.trim().length<2)return B.err='Informe seu nome.',drawBk();if(ph_.length<10)return B.err='Informe um telefone/WhatsApp válido com DDD.',drawBk();if(B.email&&!/^\S+@\S+\.\S+$/.test(B.email))return B.err='E-mail inválido.',drawBk()}B.step++;B.err='';drawBk()}
let W=null;const cw=()=>{try{W&&W.close()}catch(e){}W=null};
function notifyBarber(nb){const Ba=C.barbers.find(x=>x.id===nb.barber),S=C.services.find(x=>x.id===nb.service),bn=wnum(Ba?.whats)||wnum(C.whats);if(W&&bn){try{W.location.href=`https://wa.me/${bn}?text=${encodeURIComponent(`Olá, ${Ba.name.split(' ')[0]}! Novo agendamento: ${S.name} em ${br(nb.date)} às ${nb.time}. Cliente: ${nb.name}. Telefone: ${nb.phone}.`)}`;W=null}catch(e){cw()}}else cw()}
async function confirmBk(){if(B.busy)return;B.busy=1;try{W=window.open('','_blank')}catch(e){W=null};if(DB)await loadBk();let id=B.barber;if(id==='any'){id=C.barbers.find(b=>!C.bookings.some(k=>k.barber===b.id&&k.date===B.date&&k.time===B.time)&&!C.blocks.some(k=>(k.barber==='all'||k.barber===b.id)&&k.date===B.date&&(!k.time||k.time===B.time)))?.id}else if(C.bookings.some(k=>k.barber===id&&k.date===B.date&&k.time===B.time))id=null;
 B.busy=0;if(!id){cw();B.err='Este horário acabou de ser reservado por outra pessoa. Escolha outro.';B.step=4;return drawBk()}
 const nb={id:Date.now(),service:B.service,barber:id,date:B.date,time:B.time,name:B.name.trim(),phone:B.phone,email:B.email};nb.key=bkey(nb);
 if(DB){try{const r=DB.collection('busy').doc(nb.key);if((await r.get()).exists){cw();await loadBk();B.err='Este horário acabou de ser reservado por outra pessoa. Escolha outro.';B.step=4;return drawBk()}await r.set({id:nb.id,barber:id,date:nb.date,time:nb.time,service:nb.service,key:nb.key,name:nb.name.split(' ')[0]});await DB.collection('bookings').doc(String(nb.id)).set(nb)}catch(e){}}

function drawBk(){const S=C.services.find(x=>x.id===B.service),Ba=C.barbers.find(x=>x.id===B.barber),st=B.step;let h=`<div class="box"><div style="display:flex;justify-content:space-between"><h3>Agendamento</h3><button class="burger" style="display:block;font-size:22px" onclick="closeBk()" aria-label="Fechar">✕</button></div>`;

 h+=`<div class="prog">${[1,2,3,4,5,6].map(i=>`<i class="${i<=st?'a':''}"></i>`).join('')}</div>`;
 if(st===1)h+=`<p class="tag">1 · Serviço</p><br>`+C.services.map(s=>`<button class="opt ${B.service===s.id?'s':''}" onclick="setB('service','${s.id}',2)">${esc(s.name)} <b style="float:right">${esc(s.price)}</b></button>`).join('');
 if(st===2)h+=`<p class="tag">2 · Barbeiro</p><br><button class="opt ${B.barber==='any'?'s':''}" onclick="setB('barber','any',3)">Qualquer barbeiro</button>`+C.barbers.map(b=>`<button class="opt ${B.barber===b.id?'s':''}" onclick="setB('barber','${b.id}',3)">${esc(b.name)} <small style="color:var(--mu)">· ${esc(b.spec)}</small></button>`).join('');
 if(st===3){const m=B.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();const fa=firstAvail();h+=`<p class="tag">3 · Data</p><p style="color:var(--mu);font-size:13px;margin:6px 0">Escolha um dia em dourado. Use ‹ › para trocar de mês.</p>${fa?`<button class="btn o" style="padding:8px 14px;margin:6px 0" onclick="setB('date','${iso(fa)}',4)">Próximo dia disponível: ${br(iso(fa))}</button>`:'<p class="err">Sem datas disponíveis nos próximos 90 dias. Fale pelo WhatsApp.</p>'}<div class="nv"><button class="btn o" onclick="B.month=new Date(${y},${mo-1},1);drawBk()">‹</button><b style="text-transform:capitalize">${m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="btn o" onclick="B.month=new Date(${y},${mo+1},1);drawBk()">›</button></div><div class="cal" style="margin-top:12px">${'DSTQQSS'.split('').map(x=>`<small style="color:var(--mu)">${x}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:n},(_,i)=>{const d=new Date(y,mo,i+1),k=iso(d),dis=!dayOpen(d)||!slotsFor(k).length;return `<button ${dis?'disabled':''} class="${B.date===k?'s':''}" onclick="setB('date','${k}',4)">${i+1}</button>`}).join('')}</div>`}
 if(st===4){const sl=slotsFor(B.date);h+=`<p class="tag">4 · Horário — ${br(B.date)}</p><br>${sl.length?`<div class="slots">${sl.map(t=>`<button class="opt ${B.time===t?'s':''}" onclick="setB('time','${t}',5)">${t}</button>`).join('')}</div>`:'<p>Sem horários disponíveis. Escolha outra data.</p>'}`}
 if(st===5)h+=`<p class="tag">5 · Seus dados</p><br><label>Nome *<input id="fn" autocomplete="name" value="${esc(B.name)}" oninput="B.name=this.value"></label><label>Telefone/WhatsApp *<input id="fp" type="tel" autocomplete="tel" placeholder="(XX) XXXXX-XXXX" value="${esc(B.phone)}" oninput="B.phone=this.value"></label><label>E-mail (opcional)<input type="email" value="${esc(B.email)}" oninput="B.email=this.value"></label>`;

 if(tab==='hr')h+='<h3>Funcionamento (vazio = fechado)</h3><br>'+['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((d,i)=>{const v=C.hours[i]||['',''];return `<div class="row"><b>${d}</b><label>Abre<input type="time" value="${v[0]}" onchange="hrs(${i},0,this.value)"></label><label>Fecha<input type="time" value="${v[1]}" onchange="hrs(${i},1,this.value)"></label></div>`}).join('')+`<div class="bt" style="margin:14px 0"><button class="btn o" onclick="resetHours()">Restaurar horários padrão</button><button class="btn o" onclick="clearBlocks()">Remover todos os bloqueios</button></div><br><h3>Bloquear horário</h3><div class="row"><label>Data<input type="date" id="bd"></label><label>Hora (vazio = dia todo)<input type="time" id="bt"></label><label>Barbeiro<select id="bb"><option value="all">Todos</option>${C.barbers.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><button class="btn" onclick="if(bd.value){C.blocks.push({date:bd.value,time:bt.value,barber:bb.value});save();drawAdm()}else toast('Escolha a data')">Bloquear</button></div>`+C.blocks.map((k,i)=>`<p>${br(k.date)} ${k.time||'dia todo'} · ${k.barber==='all'?'Todos':esc(C.barbers.find(b=>b.id===k.barber)?.name||'-')} <button class="btn o" style="padding:4px 10px" onclick="C.blocks.splice(${i},1);save();drawAdm()">Remover</button></p>`).join('');
 if(tab==='in')h+=`<div class="card" style="margin-bottom:18px"><h3>Salvar cópia do site</h3><p style="margin:6px 0 12px">Baixa um arquivo com o site exatamente como está agora: fotos, textos, serviços, barbeiros, horários e agendamentos.</p><button class="btn" onclick="exportSite()">Baixar cópia do site</button></div><div class="row">${inp('name',C.name,'Nome da barbearia')}${inp('whats',C.whats,'WhatsApp (só números, com DDI. ex: 5561999999999)')}${inp('instagram',C.instagram,'Instagram (usuário)')}${inp('address',C.address,'Endereço')}${inp('adminPassword',C.adminPassword,'Senha do admin')}</div><p class="sub">Dados salvos neste navegador. Para banco de dados compartilhado, é preciso conectar um backend.</p>`;
 adm.innerHTML=h+'</div>'}
let agDate=iso(new Date()),BV=null;
const baseSlots=date=>{const[y,m,d]=date.split('-').map(Number),h=C.hours[new Date(y,m-1,d).getDay()];if(!h||!h[0]||!h[1])return[];const[a,b]=h.map(x=>x.split(':').reduce((p,q)=>p*60+ +q)),o=[];for(let t=a;t+30<=b;t+=30)o.push(pad(t/60|0)+':'+pad(t%60));return o};
const shiftDay=n=>{const[y,m,d]=agDate.split('-').map(Number);agDate=iso(new Date(y,m-1,d+n))};
const cancelBk=id=>{const k=C.bookings.find(x=>x.id===id);C.bookings=C.bookings.filter(x=>x.id!==id);dbDel(k);save();drawAdm();toast('Agendamento cancelado')};
function grid(bids,cc){const sl=baseSlots(agDate);if(!sl.length)return'<p>Fechado neste dia.</p>';return`<div style="overflow-x:auto"><table><tr><th>Hora</th>${bids.map(id=>`<th>${esc(C.barbers.find(b=>b.id===id)?.name||'-')}</th>`).join('')}</tr>${sl.map(t=>`<tr><td><b>${t}</b></td>${bids.map(id=>{const k=C.bookings.find(x=>x.barber===id&&x.date===agDate&&x.time===t);if(k)return`<td style="background:#1f1a0e"><b>${esc(k.name||'Reservado')}</b>${k.phone?`<br><a style="color:var(--go)" target="_blank" rel="noopener" href="https://wa.me/${wnum(k.phone)}">${esc(k.phone)}</a>`:''}<br><small>${esc(C.services.find(s=>s.id===k.service)?.name||'')}</small>${cc?`<br><a href="#" style="color:#e5765f;font-size:12px" onclick="cancelBk(${k.id});return false">cancelar</a>`:''}</td>`;const bl=C.blocks.some(x=>(x.barber==='all'||x.barber===id)&&x.date===agDate&&(!x.time||x.time===t));return`<td style="color:var(--mu)">${bl?'Bloqueado':'Livre'}</td>`}).join('')}</tr>`).join('')}</table></div>`}
const dayNav=fn=>`<div class="nv" style="margin:10px 0;flex-wrap:wrap"><button class="btn o" onclick="shiftDay(-1);${fn}()">‹</button><input type="date" style="width:auto;margin:0" value="${agDate}" onchange="agDate=this.value||agDate;${fn}()"><button class="btn o" onclick="shiftDay(1);${fn}()">›</button><button class="btn o" onclick="agDate=iso(new Date());${fn}()">Hoje</button><button class="btn o" onclick="loadBk().then(${fn})">Atualizar</button></div>`;
let BT='hoje',PK='',SEEN=[];const markSeen=()=>{mem('bbSeen_'+BV,JSON.stringify(C.bookings.filter(k=>k.barber===BV).map(k=>k.id)));drawBarber()};
function alertNew(n){const k=n[0],t=`Novo agendamento: ${k.name||'cliente'} às ${k.time} (${br(k.date)})`;toast(t);try{navigator.vibrate&&navigator.vibrate(200);if('Notification' in window&&Notification.permission==='granted')new Notification('Novo agendamento',{body:t})}catch(e){}}
const mem=(k,v)=>{try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
async function showBarber(){adm.classList.add('on');let r='';try{r=localStorage.getItem('bbBarber')||''}catch(e){}if(r&&C.barbers.some(x=>x.id===r)){BV=r;await loadBk();return drawBarber()}BV=null;PK='';loginB()}
function loginB(){adm.innerHTML=`<div class="w" style="max-width:420px;padding-top:8vh"><h2>Área do barbeiro</h2><p class="sub" style="margin-bottom:16px">1. Toque no seu nome</p>${C.barbers.map(b=>`<button class="opt ${PK===b.id?'s':''}" style="font-size:18px;padding:18px" onclick="PK='${b.id}';loginB()">${esc(b.name)}</button>`).join('')}${PK?`<p class="sub" style="margin:16px 0 6px">2. Digite seu PIN</p><input id="bp" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="font-size:22px;text-align:center;letter-spacing:6px" onkeydown="if(event.key==='Enter')bLogin()"><label style="font-size:14px;color:var(--mu)"><input type="checkbox" id="bm" checked style="width:auto;margin:0 8px 0 0">Manter conectado neste aparelho</label><div class="err" id="be"></div><button class="btn" style="width:100%;margin-top:10px;padding:18px" onclick="bLogin()">Entrar</button>`:''}<div class="nv"><button class="btn o" onclick="adm.classList.remove('on');history.replaceState(null,'',location.pathname)">Voltar ao site</button></div></div>`;if(PK)setTimeout(()=>$('#bp')&&$('#bp').focus(),50)}
async function bLogin(){const b=C.barbers.find(x=>x.id===PK);if(!b||!String(b.pin||'').trim()){$('#be').textContent='PIN ainda não definido. Peça ao administrador.';return}if(String(b.pin).trim()!==$('#bp').value.trim()){$('#be').textContent='PIN incorreto. Tente de novo.';return}BV=b.id;if($('#bm').checked)mem('bbBarber',b.id);await loadBk();drawBarber()}
function bcard(k){const sv=C.services.find(x=>x.id===k.service);return`<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:10px;padding:16px"><div class="price" style="margin:0;min-width:70px">${k.time}</div><div style="flex:1"><b style="font-size:18px">${esc(k.name||'Cliente')}</b>${SEEN.includes(k.id)?'':' <span style="background:var(--go);color:#111;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700">NOVO</span>'}<br><small style="color:var(--mu)">${esc(sv?.name||'')}</small></div>${k.phone?`<a class="btn o" style="padding:10px 12px" href="tel:${wnum(k.phone)}">Ligar</a><a class="btn" style="padding:10px 12px" target="_blank" rel="noopener" href="https://wa.me/${wnum(k.phone)}">WhatsApp</a>`:''}</div>`}
function drawBarber(){const b=C.barbers.find(x=>x.id===BV);if(!b)return loginB();let raw=null;try{raw=localStorage.getItem('bbSeen_'+BV)}catch(e){}if(raw===null){SEEN=C.bookings.filter(k=>k.barber===BV).map(k=>k.id);mem('bbSeen_'+BV,JSON.stringify(SEEN))}else SEEN=JSON.parse(raw);const nw=C.bookings.filter(k=>k.barber===BV&&k.date>=iso(new Date())&&!SEEN.includes(k.id));const days=BT==='hoje'?[0]:BT==='amanha'?[1]:[0,1,2,3,4,5,6],t=new Date(),ds=days.map(n=>iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+n))),L=C.bookings.filter(k=>k.barber===BV&&ds.includes(k.date)).sort((a,c)=>(a.date+a.time).localeCompare(c.date+c.time));
adm.innerHTML=`<div class="w" style="max-width:640px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Olá, ${esc(b.name.split(' ')[0])}</h2><button class="btn o" onclick="mem('bbBarber');BV=null;PK='';loginB()">Sair</button></div><div class="tabs">${[['hoje','Hoje'],['amanha','Amanhã'],['sem','7 dias']].map(([k,l])=>`<button class="btn ${BT===k?'':'o'}" style="flex:1" onclick="BT='${k}';drawBarber()">${l}</button>`).join('')}<button class="btn o" onclick="loadBk().then(drawBarber);toast('Agenda atualizada')">↻</button>${'Notification' in window&&Notification.permission==='default'?'<button class="btn o" style="flex-basis:100%" onclick="Notification.requestPermission().then(drawBarber)">🔔 Ativar avisos neste aparelho</button>':''}</div>${nw.length?`<div class="card" style="border-color:var(--go);margin-bottom:14px"><b>🔔 ${nw.length} novo${nw.length>1?'s':''} agendamento${nw.length>1?'s':''}</b><br><button class="btn" style="margin-top:10px;padding:10px 14px" onclick="markSeen()">Marcar como visto${nw.length>1?'s':''}</button></div>`:''}<p class="sub" style="margin-bottom:14px">${L.length} cliente${L.length===1?'':'s'} ${BT==='sem'?'nos próximos 7 dias':BT==='hoje'?'hoje':'amanhã'}</p>${L.length?ds.filter(d=>L.some(k=>k.date===d)).map(d=>`${BT==='sem'?`<p class="tag" style="margin:14px 0 8px">${br(d)}</p>`:''}${L.filter(k=>k.date===d).map(bcard).join('')}`).join(''):'<div class="card"><p>Nenhum cliente agendado neste período.</p></div>'}<div class="nv"><button class="btn o" onclick="adm.classList.remove('on');history.replaceState(null,'',location.pathname)">Voltar ao site</button></div></div>`}
setInterval(async()=>{if(BV&&adm.classList.contains('on')&&DB){const old=new Set(C.bookings.map(k=>k.id));await loadBk();const n=C.bookings.filter(k=>k.barber===BV&&!old.has(k.id));if(n.length)alertNew(n);drawBarber()}},30000);
function buildSite(){const snap=JSON.stringify(C).replace(/</g,'\\u003c'),js=SRCJS.replace('/*@SAVED'+'@*/','SAVED='+snap+';');
 return '<!DOCTYPE html>\n<html lang="pt-BR"><head>'+SRCHEAD+'</head><body>\n<div id="app"></div><div class="modal" id="bk"></div><div class="modal" id="lb" onclick="this.classList.remove(\'on\')"><img id="lbi" style="max-width:94vw;max-height:90vh;border-radius:4px"></div><div class="adm" id="adm"></div>\n<script>\n'+js+'\n<\/script></body></html>'}
async function exportSite(){if(!SRCJS)return toast('Não foi possível gerar a cópia neste navegador');const d=await (window.claude?window.claude.use('downloads'):null);if(!d)return toast('Download indisponível aqui. Abra o site pelo link da Claude.');try{await d.save({filename:'site-barbearia-atual.html',data:buildSite()});toast('Cópia salva')}catch(e){toast('Não foi possível salvar ('+((e&&e.code)||'erro')+')')}}
const hrs=(d,i,v)=>{const c=[...(C.hours[d]||['',''])];c[i]=v;C.hours[d]=c;save()};
const resetHours=()=>{C.hours=structuredClone(DEFAULT.hours);save();drawAdm();toast('Horários padrão restaurados')},clearBlocks=()=>{C.blocks=[];save();drawAdm();toast('Bloqueios removidos')};
function healHours(){const h=C.hours;if(!h||typeof h!=='object'||![0,1,2,3,4,5,6].some(i=>h[i]&&h[i][0]&&h[i][1])){C.hours=structuredClone(DEFAULT.hours);try{save()}catch(e){}}};
function pic(el,i){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=400;c.height=500;c.getContext('2d').drawImage(im,0,0,400,500);C.barbers[i].photo=c.toDataURL('image/jpeg',.7);save();drawAdm()};im.src=r.result};r.readAsDataURL(f)}
render();initDb().then(()=>render());route();addEventListener('hashchange',route);
